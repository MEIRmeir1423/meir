<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap">
<style>
/* מתפלסף מול ארבע דלתות. הבית בלילה; כל חדר מתבהר, עד לאור היום של חלק ד'. */
:root {
  color-scheme: dark;
  /* הפלטה לקוחה מהסרט: חלל כחול־ירקרק, אורות כדור הארץ, קרח החלום, ואור הבוקר של הקפה */
  --night: #071a22;       /* החלל שבו האיש מתכופף מעל העולם */
  --night-2: #0d2632;
  --paper: #e9eff0;       /* לבן קר */
  --muted: #9cb0b6;
  --candle: #eba04c;      /* אורות הערים על הכדור, הדיסקה הכתומה */
  --candle-soft: rgba(235, 160, 76, .18);
  --line: rgba(233, 239, 240, .14);

  --a: #6fa9c2;  /* המבוך: קרח החלום */
  --b: #2f8a95;  /* הריפוי: טורקיז הגלקסיה */
  --c: #d99a3e;  /* השחרור: שחר ברחוב */
  --d: #a8713f;  /* ההתבהרות: הקפה בבוקר */

  --serif: "Frank Ruhl Libre", "Frank Ruehl CLM", "David Libre", "Times New Roman", serif;
  --sans: "Assistant", "Heebo", "Arial Hebrew", Arial, sans-serif;

  --step--1: .875rem;
  --step-0: 1.0625rem;
  --step-1: 1.3rem;
  --step-2: 1.7rem;
  --step-3: clamp(2.2rem, 6vw, 3.4rem);
  --step-4: clamp(2.6rem, 8.5vw, 5.2rem);
  --gutter: clamp(16px, 4vw, 40px);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font-family: var(--serif);
  font-size: var(--step-0);
  line-height: 1.7;
  overflow-x: clip;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; font-weight: 700; line-height: 1.2; margin: 0; }
p { margin: 0; }
.wrap { width: 100%; max-width: 980px; margin-inline: auto; padding-inline: var(--gutter); }
.read { max-width: 40rem; }
.ui { font-family: var(--sans); }
.eyebrow { font-family: var(--sans); font-size: var(--step--1); letter-spacing: .06em; color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- כפתורים ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .5em;
  font-family: var(--sans); font-weight: 700; font-size: 1rem;
  padding: .7em 1.3em; border-radius: 999px; text-decoration: none;
  border: 1px solid currentColor; background: transparent; cursor: pointer;
  transition: background .2s, color .2s, transform .2s;
}
.btn:hover { transform: translateY(-1px); }
.btn-buy { background: var(--candle); color: #1d1608; border-color: var(--candle); }
.btn-buy:hover { background: #f2cb83; }
.btn-ghost { color: var(--paper); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--paper); }
.link-btn {
  background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--sans); font-weight: 700; font-size: .95rem;
  color: var(--accent, var(--candle)); text-decoration: underline; text-underline-offset: 4px;
}

/* ============================================================
   הבית
   ============================================================ */
.home { padding-block: clamp(28px, 6vw, 64px) 0; }
.home-head { text-align: center; display: grid; gap: .6rem; justify-items: center; }
.home-head h1 {
  font-size: var(--step-4); font-weight: 900; letter-spacing: -.01em;
  line-height: 1.02;
}
.home-head h1 .mid { color: var(--candle); }
.home-head .sub { font-size: var(--step-1); color: var(--muted); }
.opening-q {
  margin-top: 1.4rem; font-size: var(--step-2); font-weight: 400;
  color: var(--paper); max-width: 22ch;
}

/* הבמה: דלתות, רצפה, מתפלסף */
.stage {
  position: relative; margin: clamp(24px, 5vw, 48px) auto 0;
  max-width: 760px; padding-bottom: clamp(96px, 16vw, 130px);
}
.stage::before { /* הרצפה: אור שנופל מהדלתות */
  content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 34%;
  background: radial-gradient(55% 60% at 50% 0%, var(--candle-soft), transparent 75%);
  border-top: 1px solid var(--line);
  pointer-events: none;
}
.doors { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 3vw, 34px); }
.door-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: .7rem; justify-items: center; text-align: center; min-width: 0; }
.door {
  --col: var(--candle);
  position: relative; width: 100%; aspect-ratio: 1 / 2.05; max-width: 150px;
  border: 0; padding: 0; cursor: pointer; background: transparent;
  perspective: 700px;
}
.door .frame {
  position: absolute; inset: 0; border-radius: 48% 48% 3px 3px / 22% 22% 3px 3px;
  background: radial-gradient(80% 60% at 50% 70%, #fff3d6, var(--candle) 45%, #8a5a1c 100%);
  box-shadow: 0 0 0 4px #0f2a36, 0 0 0 5px var(--line), 0 0 40px -6px var(--candle);
  overflow: hidden;
}
.door .panel {
  position: absolute; inset: 0; border-radius: inherit;
  background:
    linear-gradient(90deg, rgba(0,0,0,.25), transparent 18%, transparent 82%, rgba(0,0,0,.3)),
    linear-gradient(var(--col), color-mix(in srgb, var(--col) 60%, #000));
  transform-origin: 100% 50%; transform: rotateY(0deg);
  transition: transform .7s cubic-bezier(.3,.7,.2,1);
  display: grid; place-items: center;
  border-radius: 48% 48% 3px 3px / 22% 22% 3px 3px;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,.18);
}
.door .panel .glyph {
  mix-blend-mode: normal;
  font-family: var(--serif); font-weight: 900; font-size: clamp(1.8rem, 6vw, 3.4rem);
  color: rgba(255,255,255,.82); text-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.door .panel::after { /* ידית */
  content: ""; position: absolute; left: 12%; top: 55%; width: 7%; aspect-ratio: 1;
  border-radius: 50%; background: #e9d29b; box-shadow: 0 1px 2px rgba(0,0,0,.5);
}
.door:hover .panel, .door:focus-visible .panel { transform: rotateY(-28deg); }
.door.open .panel { transform: rotateY(-105deg); }
.door.visited .frame { box-shadow: 0 0 0 4px #0f2a36, 0 0 0 5px var(--candle), 0 0 46px -4px var(--candle); }
.door-label { display: grid; gap: .15rem; }
.door-label { width: 100%; min-width: 0; }
.door-label b { font-size: clamp(.8rem, 2.6vw, 1.25rem); overflow-wrap: anywhere; }
.door-label span { font-family: var(--sans); font-size: clamp(.72rem, 2.1vw, .9rem); color: var(--muted); line-height: 1.35; }
.door-label .seen { color: var(--candle); }

.figure {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: clamp(54px, 12vw, 92px); pointer-events: none;
  filter: drop-shadow(0 18px 18px rgba(0,0,0,.5));
}
.figure svg { display: block; width: 100%; height: auto; }
.figure .fig { fill: #07070d; }
.stage-hint { text-align: center; margin-top: 1rem; color: var(--muted); font-family: var(--sans); font-size: .95rem; max-width: 34rem; margin-inline: auto; }
.after-d { margin-top: .8rem; text-align: center; color: var(--candle); font-size: var(--step-1); }

/* מעבר אל החדר */
.home.leaving .stage { transition: transform .8s cubic-bezier(.5,0,.3,1), opacity .8s; transform: scale(1.6); opacity: 0; }
.home.leaving .home-head { transition: opacity .4s; opacity: 0; }

/* קטעים תחתונים בבית */
.band { padding-block: clamp(48px, 8vw, 90px); border-top: 1px solid var(--line); }
.band h2 { font-size: var(--step-2); margin-bottom: .8rem; }
.fly-quote { display: grid; gap: 1rem; }
.fly-quote blockquote { margin: 0; font-size: var(--step-1); line-height: 1.6; }
.fly-quote cite { font-style: normal; color: var(--muted); font-family: var(--sans); font-size: .95rem; }
.video-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(20px, 4vw, 44px); align-items: center; }
.video-row > * { min-width: 0; }
.video-box {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(70% 90% at 50% 100%, var(--candle-soft), transparent), var(--night-2);
  border: 1px solid var(--line); display: grid; place-items: center; text-align: center;
}
.video-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-box button { background: none; border: 0; cursor: pointer; display: grid; gap: .6rem; justify-items: center; }
.play { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--candle); display: grid; place-items: center; }
.play::after { content: ""; border-style: solid; border-width: 11px 18px 11px 0; border-color: transparent var(--candle) transparent transparent; margin-left: -3px; }
.buy-band { text-align: center; display: grid; gap: 1rem; justify-items: center; }
.buy-band p { color: var(--muted); max-width: 36rem; }
.foot { padding-block: 32px; color: var(--muted); font-family: var(--sans); font-size: .85rem; text-align: center; border-top: 1px solid var(--line); }
.foot a { color: var(--paper); }

/* ============================================================
   החדרים
   ============================================================ */
.room {
  --bg: var(--night); --fg: var(--paper); --mute: var(--muted); --accent: var(--candle);
  --surface: rgba(255,255,255,.04); --rule: var(--line);
  background: var(--bg); color: var(--fg); min-height: 100%;
}
@keyframes enter { from { opacity: .35; transform: translateY(14px); } }
.room[data-room="a"] { --bg: #08161e; --accent: #8fd0e6; --surface: rgba(143,208,230,.07); }
.room[data-room="b"] { --bg: #0b1c25; --accent: #5cc3c4; --surface: rgba(92,195,196,.07); }
.room[data-room="c"] { --bg: #1c160e; --accent: #f0b65a; --surface: rgba(240,182,90,.08); }
.room[data-room="d"] {
  --bg: #f4ead8; --fg: #2b1d12; --mute: #6e5a48; --accent: #9a5518;
  --surface: rgba(154,85,24,.07); --rule: rgba(43,29,18,.16);
  color-scheme: light;
}
.room .btn-ghost { color: var(--fg); border-color: var(--rule); }
.room .eyebrow { color: var(--mute); }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.topbar nav { display: flex; gap: 6px; }
.topbar nav a {
  font-family: var(--serif); font-weight: 900; text-decoration: none; width: 2.1rem; height: 2.1rem;
  display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--rule); color: var(--mute);
}
.topbar nav a[aria-current="page"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.topbar .home-link { font-family: var(--sans); font-weight: 700; text-decoration: none; font-size: .95rem; }
.topbar .btn { padding: .45em 1em; font-size: .9rem; }

.room-head { padding-block: clamp(36px, 7vw, 80px) clamp(24px, 4vw, 40px); display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 4vw, 40px); align-items: start; }
.room-head > * { min-width: 0; }
.big-letter { font-weight: 900; font-size: clamp(5rem, 20vw, 11rem); line-height: .8; color: var(--accent); }
.room-head h1 { font-size: var(--step-3); }
.room-head .lead { margin-top: 1rem; font-size: var(--step-1); line-height: 1.6; max-width: 38rem; }
.epigraph { margin: 1.4rem 0 0; padding-inline-start: 1rem; border-inline-start: 2px solid var(--accent); color: var(--mute); max-width: 36rem; }
.epigraph cite { display: block; font-style: normal; font-family: var(--sans); font-size: .85rem; margin-top: .3rem; }
.howto { font-family: var(--sans); color: var(--mute); font-size: .95rem; max-width: 40rem; padding-block-end: 8px; }

.section { padding-block: clamp(28px, 5vw, 52px); border-top: 1px solid var(--rule); }
.section > h2 { font-size: var(--step-2); }
.section > .note { margin-top: .5rem; color: var(--mute); max-width: 40rem; }
.ch {
  font-family: var(--sans); font-size: .78rem; font-weight: 700; letter-spacing: .04em;
  color: var(--accent); white-space: nowrap;
}

/* כרטיסי שאלה */
.cards { display: grid; gap: 12px; margin-top: 1.4rem; }
.qcard { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); scroll-margin-top: 80px; }
.qcard > button.qhead {
  width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  background: none; border: 0; padding: 18px 20px; cursor: pointer; text-align: start;
}
.qhead .qt { font-size: var(--step-1); font-weight: 700; line-height: 1.35; }
.qhead .qt::before { content: "+"; display: inline-block; width: 1.2em; color: var(--accent); font-family: var(--sans); }
.qcard.open .qhead .qt::before { content: "–"; }
.qbody { padding: 0 20px 20px; display: grid; gap: 14px; }
.step { display: grid; gap: 4px; animation: enter .45s ease both; }
.step .lbl { font-family: var(--sans); font-weight: 800; font-size: .8rem; letter-spacing: .06em; color: var(--accent); }
.step p { max-width: 40rem; }
.qbody .next { justify-self: start; }
.threads { display: flex; flex-wrap: wrap; gap: 10px 22px; padding-top: 6px; border-top: 1px dashed var(--rule); }
.qcard.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* משחק אגריפס */
.game { margin-top: 1.4rem; border: 1px solid var(--rule); border-radius: 12px; padding: clamp(18px, 4vw, 30px); display: grid; gap: 14px; background: var(--surface); }
.chain { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chain li { display: grid; grid-template-columns: auto 1fr; gap: 10px; animation: enter .4s ease both; }
.chain li .who { font-family: var(--sans); font-size: .8rem; font-weight: 700; color: var(--mute); padding-top: .3em; min-width: 3.6em; }
.chain li.claim p { font-size: var(--step-1); font-weight: 700; }
.chain li.ask p { color: var(--accent); font-style: italic; }
.chain li.circle p::after { content: "  ↺"; color: var(--accent); }
.exits { display: flex; flex-wrap: wrap; gap: 10px; }
.exit-out { display: grid; gap: 4px; }
.exit-out b { color: var(--accent); }
.verdict { padding-top: 12px; border-top: 1px solid var(--rule); }

.diagnosis { margin-top: 1.4rem; display: grid; gap: 1rem; max-width: 42rem; }
.diagnosis .pull { font-size: var(--step-2); line-height: 1.35; color: var(--accent); font-weight: 700; }

/* חלק ב': כרטיסי היפוך */
.flips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-top: 1.4rem; }
.flip {
  text-align: start; cursor: pointer; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface);
  padding: 18px; display: grid; gap: 8px; align-content: start; min-height: 9.5rem;
}
.flip .front { font-size: var(--step-1); line-height: 1.35; color: var(--mute); }
.flip .back { font-size: var(--step-1); line-height: 1.35; font-weight: 700; color: var(--accent); }
.flip .txt { font-size: .98rem; }
.flip:not(.on) .back, .flip:not(.on) .txt { display: none; }
.flip.on .front { text-decoration: line-through; text-decoration-color: var(--accent); }
.flip .tap { font-family: var(--sans); font-size: .8rem; color: var(--mute); }
.flip.on .tap { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: var(--sans); font-weight: 700; cursor: pointer;
  border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: .45em 1.05em;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.holiday-q { font-size: var(--step-2); font-weight: 700; }
.holiday-q .slot { color: var(--accent); border-bottom: 2px dashed var(--accent); padding-inline: .2em; }
.answer { min-height: 3.4em; font-size: var(--step-1); line-height: 1.5; }
.answer.odd { color: var(--accent); }

.jar-box { display: grid; grid-template-columns: minmax(0, 240px) 1fr; gap: clamp(16px, 4vw, 40px); align-items: center; margin-top: 1.4rem; }
.jar-box > * { min-width: 0; }
.jar-box svg { width: 100%; height: auto; display: block; }
.jar-glass { fill: rgba(92,195,196,.08); stroke: var(--accent); stroke-width: 2.5; }
.fly-dot { fill: var(--fg); }

/* חלק ג': שערים */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
.tab {
  cursor: pointer; border: 1px solid var(--rule); background: transparent; border-radius: 8px;
  padding: .6em 1em; font-family: var(--serif); font-weight: 700; font-size: 1.05rem;
}
.tab small { display: block; font-family: var(--sans); font-weight: 400; font-size: .75rem; color: var(--mute); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.tab[aria-selected="true"] small { color: inherit; }
.gate-new { margin-top: .8rem; font-family: var(--sans); font-size: .9rem; color: var(--accent); }

/* חלק ד' */
.pattern { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 1.4rem; counter-reset: s; }
.pattern li { list-style: none; border-top: 3px solid var(--accent); padding-top: 12px; display: grid; gap: 6px; }
.pattern li b { font-size: var(--step-1); }
.pattern li b::before { counter-increment: s; content: counter(s) ". "; color: var(--accent); }
.pattern { padding: 0; margin-inline: 0; }
.fronts { margin-top: 1.8rem; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.fronts div { display: grid; grid-template-columns: 6rem 1fr auto 1fr; gap: 12px; align-items: baseline; padding-block: 10px; border-bottom: 1px solid var(--rule); }
.fronts div > * { min-width: 0; }
.fronts .k { font-weight: 700; }
.fronts .f { color: var(--mute); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--mute) 60%, transparent); }
.fronts .arr { color: var(--accent); font-family: var(--sans); }
.fronts .t { font-weight: 700; color: var(--accent); }

.sorter { margin-top: 1.4rem; display: grid; gap: 10px; }
.sort-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
.sort-row > * { min-width: 0; }
.sort-row .it { font-weight: 700; }
.sort-row .fb { grid-column: 1 / -1; font-family: var(--sans); font-size: .88rem; }
.sort-row .fb.ok { color: var(--accent); }
.sort-row .fb.no { color: #a2462e; }
.sort-btns { display: flex; gap: 6px; }
.sort-btns .chip { font-size: .85rem; padding: .35em .85em; }
.score { font-family: var(--sans); color: var(--mute); }

.ending { padding-block: clamp(48px, 9vw, 110px); display: grid; gap: 1.2rem; justify-items: center; text-align: center; }
.ending p { max-width: 34rem; font-size: var(--step-1); line-height: 1.6; }
.ending p:first-child { font-size: var(--step-3); font-weight: 900; line-height: 1.15; color: var(--accent); }
.ending .btn-buy { margin-top: 1rem; font-size: 1.1rem; }

.room-foot { padding-block: 28px 48px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }

/* ---------- טלפון ---------- */
@media (max-width: 640px) {
  .video-row, .jar-box { grid-template-columns: 1fr; }
  .jar-box svg { max-width: 200px; margin-inline: auto; }
  .room-head { grid-template-columns: 1fr; }
  .big-letter { font-size: 5.5rem; }
  .pattern { grid-template-columns: 1fr; }
  .fronts div { grid-template-columns: 1fr auto 1fr; }
  .fronts .k { grid-column: 1 / -1; }
  .sort-row { grid-template-columns: 1fr; }
  .topbar .btn { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .tab { padding: .5em .3em; text-align: center; }
  .stage::before { height: 24%; }
  .qcard > button.qhead { padding: 16px; }
  .qbody { padding: 0 16px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- תמונות מהסרט ---------- */
.hero-still {
  position: relative; margin-inline: calc(50% - 50vw); margin-top: calc(-1 * clamp(28px, 6vw, 64px));
  padding: clamp(40px, 9vw, 110px) var(--gutter) clamp(20px, 4vw, 40px);
  background: linear-gradient(180deg, rgba(7,26,34,.55), rgba(7,26,34,.35) 40%, var(--night) 100%);
}
.still {
  height: clamp(180px, 34vw, 380px);
  background: var(--still) center / cover no-repeat;
  -webkit-mask: linear-gradient(#000 55%, transparent);
          mask: linear-gradient(#000 55%, transparent);
}
.room-head { margin-top: calc(-1 * clamp(70px, 12vw, 150px)); position: relative; }
.room-head .big-letter { text-shadow: 0 4px 30px rgba(0,0,0,.45); }
.room[data-room="d"] .room-head .big-letter { text-shadow: none; }
.figure-still { margin-top: 1.2rem; width: min(100%, 620px); border-radius: 8px; overflow: hidden; max-width: 100%; }
.figure-still img { display: block; width: 100%; height: auto; }
.figure-still figcaption { font-family: var(--sans); font-size: .82rem; color: var(--mute); padding-top: .4rem; }

/* ---------- הסרט: חלון קופץ ---------- */
.btn-film {
  margin-top: 1.6rem; gap: .8em; font-size: clamp(1.05rem, 2.6vw, 1.3rem); padding: .75em 1.6em .75em 1.9em;
  background: var(--candle); color: #1d1608; border-color: var(--candle);
  box-shadow: 0 0 0 0 rgba(235,160,76,.55), 0 14px 34px -10px rgba(235,160,76,.7);
}
.btn-film:hover { background: #f5b86a; transform: translateY(-2px) scale(1.02); }
.btn-film .play-sm {
  width: 2.1em; height: 2.1em; border-radius: 50%; background: #1d1608; display: grid; place-items: center; border: 0;
}
.btn-film .play-sm::after { content: ""; border-style: solid; border-width: .45em .75em .45em 0; border-color: transparent var(--candle) transparent transparent; margin-left: -.15em; }
.btn-film small { font-weight: 400; opacity: .75; font-size: .8em; }
@keyframes filmPulse { 0% { box-shadow: 0 0 0 0 rgba(235,160,76,.55), 0 14px 34px -10px rgba(235,160,76,.7); } 70%, 100% { box-shadow: 0 0 0 18px rgba(235,160,76,0), 0 14px 34px -10px rgba(235,160,76,.7); } }

.film-pop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(3, 12, 16, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade .4s ease both;
}
.film-card {
  position: relative; width: min(100%, 980px); display: grid; gap: 14px;
  animation: pop .55s cubic-bezier(.2,.9,.25,1.15) both;
}
.film-card .video-box { box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px var(--line), 0 0 60px -10px rgba(235,160,76,.35); }
.film-cap { display: grid; gap: .3rem; max-width: 46rem; }
.film-cap h2 { font-size: var(--step-1); }
.film-cap p { color: var(--muted); font-size: .98rem; }
.film-cap .link-btn { justify-self: start; margin-top: .3rem; }
.film-x {
  position: absolute; top: -14px; left: -14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--night-2); color: var(--paper); font-size: 1.5rem; line-height: 1; cursor: pointer;
}
.video-box .film-sound { position: absolute; bottom: 64px; right: 16px; z-index: 2; display: inline-flex; font-size: .95rem; padding: .55em 1.1em; background: var(--candle); color: #1d1608; border: 0; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
body.film-open { overflow: hidden; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.9); } }
@media (max-width: 640px) { .film-x { top: -48px; left: 0; } .video-box .film-sound { bottom: 52px; right: 10px; } }

/* ---------- מפת המיקום (צד ימין) ---------- */
.room-main { min-width: 0; animation: enter .7s ease both; }
.crumb {
  flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: .1em;
  background: none; border: 0; cursor: pointer; font-family: var(--sans); font-size: .95rem; color: var(--fg);
  white-space: nowrap; overflow: hidden;
}
.crumb-room { font-weight: 800; color: var(--accent); }
.crumb-sec { color: var(--mute); overflow: hidden; text-overflow: ellipsis; }
.crumb-ico { margin-inline-start: .4em; color: var(--mute); }

.rail {
  font-family: var(--sans); background: color-mix(in srgb, var(--bg) 92%, #000);
  border-inline-end: 1px solid var(--rule); padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px 24px;
  display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
}
.rail a, .rail button { color: inherit; text-decoration: none; }
.rail-home { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; }
.rail-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--candle); box-shadow: 0 0 10px var(--candle); }
.rail-book { font-family: var(--serif); font-size: .85rem; color: var(--mute); padding-inline-start: 17px; margin-top: -6px; }
.rail-rooms { list-style: none; margin: 4px 0 0; padding: 0 0 0 0; padding-inline-start: 4px; display: grid; gap: 2px; border-inline-start: 1px solid var(--rule); margin-inline-start: 4px; }
.rail-rooms > li > a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: var(--mute); }
.rail-rooms > li > a:hover { background: var(--surface); color: var(--fg); }
.rail-letter {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50% 50% 4px 4px; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 900; color: #fff; background: var(--rc); opacity: .55;
}
.rail-name { display: grid; line-height: 1.25; font-weight: 700; font-size: .95rem; }
.rail-name small { font-weight: 400; font-size: .75rem; opacity: .8; }
.rail-rooms > li.seen .rail-letter { opacity: .8; }
.rail-rooms > li.here > a { color: var(--fg); background: var(--surface); }
.rail-rooms > li.here .rail-letter { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.rail-secs { list-style: none; margin: 4px 0 8px; padding: 0; padding-inline-start: 22px; display: grid; gap: 1px; border-inline-start: 2px solid var(--accent); margin-inline-start: 24px; }
.rail-secs a, .rail-secs button {
  display: grid; width: 100%; text-align: start; background: none; border: 0; cursor: pointer;
  font-family: var(--sans); font-size: .88rem; line-height: 1.3; padding: 6px 8px; border-radius: 6px; color: var(--mute);
}
.rail-secs small { font-size: .72rem; opacity: .8; }
.rail-secs .on { color: var(--fg); background: var(--surface); font-weight: 700; position: relative; }
.rail-secs .on::before { content: ""; position: absolute; inset-inline-start: -27px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
.rail-buy { margin-top: auto; padding-top: 16px; }
.rail-buy .btn { width: 100%; justify-content: center; }

@media (min-width: 1100px) {
  .room { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
  .rail { position: sticky; top: 0; height: 100vh; height: 100dvh; }
  .crumb { pointer-events: none; }
  .crumb-ico { display: none; }
  .topbar .wrap { max-width: none; }
}
@media (max-width: 1099.98px) {
  .rail {
    position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 40; width: min(84vw, 300px);
    transform: translateX(105%); transition: transform .3s ease; box-shadow: -20px 0 50px rgba(0,0,0,.4);
  }
  .rail.open { transform: none; }
  .topbar .home-link { font-size: .85rem; white-space: nowrap; }
}
.rail .btn-buy { color: #1d1608; }
@media (min-width: 1100px) { .topbar .btn-buy { display: none; } }
@media (max-width: 1099.98px) {
  .room::after { content: ""; position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .room:has(.rail.open)::after { opacity: 1; pointer-events: auto; }
}

/* ---------- וקטורי החריגה ---------- */
.vec { margin-top: 1.4rem; display: grid; gap: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--rule); }
.zone { padding: 16px clamp(12px, 3vw, 22px); display: grid; gap: 10px; }
.zone-h { font-family: var(--sans); font-weight: 800; font-size: 1.05rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em .6em; }
.zone-h small { font-weight: 400; font-size: .85rem; color: var(--mute); }
.vec-arrow { font-size: 1.4rem; color: var(--accent); }
.z-inf { background: linear-gradient(180deg, rgba(47,88,118,.16), rgba(47,88,118,.05)); min-height: 110px; align-content: start; }
.z-red { background: linear-gradient(0deg, rgba(110,90,72,.18), rgba(110,90,72,.05)); min-height: 110px; align-content: end; }
.z-mid { background: var(--surface); border-block: 2px solid var(--accent); }
.z-mid .zone-h { color: var(--accent); }
.z-mid.clear { background: linear-gradient(90deg, rgba(235,160,76,.18), rgba(235,160,76,.06)); }
.zone-items { display: flex; flex-wrap: wrap; gap: 8px; }
.pool { display: grid; gap: 8px; }
.tok { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--bg); }
.tok .it { font-weight: 700; }
.tok-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.tok-btns .chip { font-size: .85rem; padding: .35em .8em; }
.tok .fb { grid-column: 1 / -1; font-family: var(--sans); font-size: .85rem; }
.tok .fb.no { color: #a2462e; }
.tok.placed { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; animation: enter .45s ease both; }
.tok.placed .fb { color: var(--mute); font-size: .75rem; }
.tok.placed.inf { border-color: #2f5876; }
.tok.placed.red { border-color: #6e5a48; }
.tok.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.score { margin-top: 1rem; font-family: var(--sans); color: var(--mute); }
@media (max-width: 640px) { .tok { grid-template-columns: 1fr; } }

/* ---------- טיזר בבית ---------- */
.teaser { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(16px, 4vw, 40px); align-items: center; }
.teaser-vec { display: grid; justify-items: center; font-family: var(--sans); font-weight: 800; gap: 4px; color: var(--muted); }
.teaser-vec .mid { color: var(--candle); border-block: 2px solid var(--candle); padding: 4px 14px; }
.teaser-vec .ar { font-size: 1.6rem; line-height: 1; color: var(--paper); }
.teaser h2 { font-size: var(--step-2); }
.teaser p { color: var(--muted); max-width: 36rem; margin-block: .5rem 1rem; }

/* ---------- קישור לשאלה והתקדמות ---------- */
.copy-link { font-family: var(--sans); font-size: .82rem; background: none; border: 1px dashed var(--rule); color: var(--mute); border-radius: 999px; padding: .3em .9em; cursor: pointer; }
.copy-link:hover { color: var(--fg); border-color: var(--accent); }
.rail-prog { font-size: .7rem; color: var(--accent); font-weight: 700; margin-inline-start: auto; }

.extra { display: grid; gap: 14px; }
.extra .game { margin-top: 0; }

/* ---------- קוביות: כל השאלות פרושות ברשת (הכלל של מאיר) ---------- */
.cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; align-items: stretch; }
.qcard { transition: box-shadow .2s, transform .2s; }
.qcard:not(.open) { min-height: 9.5rem; display: grid; }
.qcard:not(.open):hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px rgba(0,0,0,.6); border-color: var(--accent); }
.qcard:not(.open) > button.qhead {
  height: 100%; flex-direction: column-reverse; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 18px;
}
.qcard:not(.open) .qhead .qt { font-size: 1.12rem; }
.qcard:not(.open) .qhead .qt::before { content: none; }
.qcard:not(.open) .qhead::after {
  content: "גע כדי לפתוח"; font-family: var(--sans); font-size: .78rem; color: var(--mute); order: -1;
}
.qcard.open { border-color: var(--accent); }
.qcard.open .qbody { padding: 0 16px 16px; }
.qcard.open > button.qhead { padding: 16px; }
.qcard.open .qhead .qt { font-size: 1.12rem; }
.qcard .step p { font-size: .98rem; }
.qcard .next { font-size: .9rem; padding: .5em 1em; }
.qcard:has(.extra:not([hidden]) :is(.game, .vec)) { grid-column: 1 / -1; }
.figure-still img { aspect-ratio: 21 / 8; object-fit: cover; }
@media (max-width: 640px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .qcard:not(.open) { min-height: 8rem; }
  .qcard:not(.open) > button.qhead { padding: 12px; gap: 8px; }
  .qcard:not(.open) .qhead .qt { font-size: 1rem; }
  .qcard.open { grid-column: 1 / -1; }
}
.qcard.seen:not(.open) { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.qcard.seen:not(.open) .qhead::after { content: "נפתחה ✓"; color: var(--accent); }

/* ---------- חלק ג': ארבעה ריבועים, ובכל אחד ריבועי הפרקים ---------- */
.gates-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding-block: 8px 40px; }
.gate-box { border: 1px solid var(--rule); border-radius: 16px; padding: clamp(14px, 2.5vw, 22px); background: var(--surface); display: grid; gap: 10px; align-content: start; scroll-margin-top: 70px; }
.gate-box h2 { font-size: var(--step-1); display: grid; gap: 2px; }
.gate-box h2 small { font-family: var(--sans); font-size: .75rem; font-weight: 700; letter-spacing: .05em; color: var(--accent); }
.gate-meta { font-family: var(--sans); font-size: .8rem; color: var(--mute); }
.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mini {
  text-align: start; cursor: pointer; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg);
  padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-height: 6.2rem;
  transition: transform .15s, border-color .15s;
}
.mini:hover { transform: translateY(-2px); border-color: var(--accent); }
.mini-ch { font-family: var(--serif); font-weight: 900; font-size: 1.5rem; line-height: 1; color: var(--accent); }
.mini-q { font-size: .95rem; line-height: 1.35; font-weight: 700; }
.mini.seen { border-color: color-mix(in srgb, var(--accent) 50%, var(--rule)); }
.mini.seen .mini-ch::after { content: " ✓"; font-size: .8rem; font-family: var(--sans); }
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(10, 8, 4, .72); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fade .3s ease both; }
.sheet-card { position: relative; width: min(100%, 720px); max-height: 100%; overflow-y: auto; background: var(--bg); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: grid; gap: 8px; animation: pop .4s cubic-bezier(.2,.9,.25,1.1) both; }
.sheet-card .film-x { top: 10px; left: 10px; }
.sheet-card .qcard { border: 0; background: none; min-height: 0; }
.sheet-card .qcard > button.qhead { padding: 4px 0 8px; cursor: default; }
.sheet-card .qcard .qhead .qt { font-size: var(--step-2); }
.sheet-card .qcard .qhead .qt::before { content: none; }
.sheet-card .qbody { padding: 0; }
@media (max-width: 640px) {
  .gates-grid { grid-template-columns: 1fr; }
  .cards { }
}

.sheet-card .qhead .ch { display: none; }
.sheet-card .eyebrow { padding-inline-end: 48px; }

/* ---------- הבית: הדלתות מיד מתחת לכותרת, על רקע התמונה ---------- */
.hero-still { padding-bottom: clamp(16px, 3vw, 28px); background: linear-gradient(180deg, rgba(7,26,34,.5), rgba(7,26,34,.3) 35%, rgba(7,26,34,.85) 75%, var(--night) 100%); }
.hero-still .stage { margin-top: clamp(20px, 4vw, 40px); }
.hero-still .home-head .sub { color: var(--paper); opacity: .85; }

/* ---------- חלון הסרט הצף ---------- */
.film-float {
  position: fixed; z-index: 30; inset-inline-end: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 16px;
  background: color-mix(in srgb, var(--night-2) 92%, transparent); border: 1px solid rgba(235,160,76,.5);
  box-shadow: 0 18px 40px -12px rgba(0,0,0,.7), 0 0 30px -8px rgba(235,160,76,.45);
  animation: pop .5s cubic-bezier(.2,.9,.25,1.2) both;
}
.film-float-open { display: flex; align-items: center; gap: 12px; background: none; border: 0; cursor: pointer; padding: 0; text-align: start; font-family: var(--sans); }
.film-thumb { width: 104px; aspect-ratio: 16 / 9; border-radius: 10px; background-size: cover; background-position: center; display: grid; place-items: center; }
.film-thumb .play-sm { width: 34px; height: 34px; border-radius: 50%; background: var(--candle); display: grid; place-items: center; box-shadow: 0 0 0 0 rgba(235,160,76,.6); }
.film-thumb .play-sm::after { content: ""; border-style: solid; border-width: 7px 11px 7px 0; border-color: transparent #1d1608 transparent transparent; margin-left: -3px; }
.film-float-txt { display: grid; padding-inline-end: 6px; }
.film-float-txt b { font-size: 1rem; color: var(--paper); }
.film-float-txt small { font-size: .78rem; color: var(--muted); }
.film-float-x { align-self: flex-start; width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.film-float-x:hover { color: var(--paper); }
@media (max-width: 640px) { .film-float { inset-inline: 12px; } .film-float-open { flex: 1; } .film-thumb { width: 88px; } }

/* ============================================================
   חזרה לעיצוב הסרט, עם המבנה החדש
   ============================================================ */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* פתיחה: כותרת פשוטה, הדלתות באמצע, כפתור רכישה רגיל */
.hero { position: relative; text-align: center; padding: clamp(26px, 4vw, 48px) var(--gutter) clamp(26px, 4vw, 44px);
  background: linear-gradient(180deg, rgba(7,26,34,.55), rgba(7,26,34,.35) 40%, rgba(7,26,34,.88) 80%, var(--night) 100%); }
.ht { display: grid; gap: .35rem; justify-items: center; }
.ht h1 { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: .2em .7em; font-family: var(--serif); font-weight: 700; font-size: clamp(1.9rem, 4.4vw, 3.2rem); line-height: 1.15; color: var(--paper); }
.ht-author { font-family: var(--sans); font-weight: 400; font-size: .42em; letter-spacing: .08em; color: var(--muted); padding-inline-start: .9em; border-inline-start: 1px solid var(--line); }
.ht-sub { font-family: var(--serif); font-size: clamp(1.1rem, 2vw, 1.4rem); color: var(--paper); opacity: .9; }
.ht-basis { font-family: var(--sans); font-size: .9rem; color: var(--muted); }
.hero .stage { margin: clamp(22px, 3.4vw, 40px) auto 0; max-width: 680px; padding-bottom: 0; }
.hero .stage::before { display: none; }

      pop.hidden = false; document.body.classList.add("film-open");
      if (film) {
        if (withSound) { film.muted = false; if (sound) sound.hidden = true; }
        const p = film.play(); if (p && p.catch) p.catch(() => {});
      }
      document.getElementById("closeFilm").focus({ preventScroll: true });
    };
    const close = () => { pop.hidden = true; document.body.classList.remove("film-open"); if (film) film.pause(); };
    document.getElementById("openFilm").addEventListener("click", () => open(true));
    document.getElementById("closeFilm").addEventListener("click", close);
    document.getElementById("closeFilm2").addEventListener("click", close);
    pop.addEventListener("click", e => { if (e.target === pop) close(); });
    document.onkeydown = e => { if (e.key === "Escape" && !pop.hidden) close(); };
    if (sound) sound.addEventListener("click", () => { film.muted = false; film.currentTime = 0; film.play(); sound.hidden = true; });
    if (film) film.addEventListener("volumechange", () => { if (!film.muted && sound) sound.hidden = true; });
    /* החלון הקטן קופץ בגלילה ולא תופס מקום בדף */
    const fl = document.getElementById("filmFloat");
    let dismissed = false; try { dismissed = sessionStorage.getItem("hm:float") === "1"; } catch (e) {}
    document.getElementById("hideFloat").addEventListener("click", () => {
      fl.hidden = true; dismissed = true; try { sessionStorage.setItem("hm:float", "1"); } catch (e) {}
    });
    if (window._filmScroll) window.removeEventListener("scroll", window._filmScroll);
    window._filmScroll = () => { if (!dismissed && fl.hidden && window.scrollY > 80) fl.hidden = false; };
    window.addEventListener("scroll", window._filmScroll, { passive: true });
    if (!dismissed) setTimeout(() => { if (!dismissed) fl.hidden = false; }, reduce ? 0 : 1200);

  function buildRail(r) {
    const list = document.getElementById("railSecs"), crumbSec = document.getElementById("crumbSec");
    const rail = document.getElementById("rail"), crumb = document.getElementById("crumb");
    const setCrumb = t => { crumbSec.textContent = t ? " › " + t : ""; };
    const closeRail = () => { rail.classList.remove("open"); crumb.setAttribute("aria-expanded", "false"); };

    rail.addEventListener("click", e => { if (e.target.closest("a, button")) closeRail(); });
    document.querySelector(".room").addEventListener("click", e => { if (e.target.classList.contains("room") && rail.classList.contains("open")) closeRail(); });
    let items;
    const secs = [...document.querySelectorAll(".room .section, .room .ending, .room .gate-box")];
    items = secs.map((s, i) => {
      s.id = s.id || `sec-${r.id}-${i}`;
      const h = s.querySelector("h2");
      let t = s.classList.contains("gate-box") ? s.dataset.title
        : h ? [...h.childNodes].filter(n => !(n.classList && n.classList.contains("ch"))).map(n => n.textContent).join("").trim() : "הסיום";
      return { el: s, label: splitTitle(t) };

    list.innerHTML = items.map(x => `<li><a href="#" data-railsec="${x.el.id}"><small>${esc(x.label[0])}</small>${esc(x.label[1])}</a></li>`).join("");

    const links = [...list.querySelectorAll("a")];
    const update = () => {
      /* השער הפעיל: השורה שנמצאת עכשיו בחלק העליון של המסך. שערים זה לצד זה מסומנים יחד */
      const y = window.innerHeight * 0.45;
      const tops = items.map(x => x.el.getBoundingClientRect().top);
      const above = tops.filter(t => t < y);
      const rowTop = above.length ? Math.max(...above) : tops[0];
      const act = tops.map(t => Math.abs(t - rowTop) < 4);
      const cur = act.indexOf(true);
      links.forEach((l, i) => l.classList.toggle("on", act[i]));
      setCrumb(cur >= 0 ? items[cur].label[1] : "");
    };

  function wireCards(root) {
    root.querySelectorAll(".qcard").forEach(card => {
      const steps = JSON.parse(card.dataset.steps);
      const body = card.querySelector(".qbody"), list = card.querySelector(".steps");
      const next = card.querySelector(".next"), th = card.querySelector(".threads");
      let shown = 0;
      const reveal = () => {
        if (!steps.length && th.hidden) { next.hidden = true; th.hidden = false; const ex = card.querySelector(".extra"); if (ex) ex.hidden = false; markOpened(card.id); card.classList.add("seen"); fit(); return; }
        if (shown >= steps.length) return;
        const [lbl, txt] = steps[shown++];
        list.insertAdjacentHTML("beforeend", `<div class="step"><span class="lbl">${esc(lbl)}</span><p>${esc(txt)}</p></div>`);
        if (shown >= steps.length) { next.hidden = true; th.hidden = false; const ex = card.querySelector(".extra"); if (ex) ex.hidden = false; markOpened(card.id); card.classList.add("seen"); }
        fit();
      };
      /* בתוך ריבוע שער: הקוביה נפתחת במקומה ומתרחבת מעל השכנות, בלי להזיז את הרשת */
      const grid = card.parentElement, inGate = !!card.closest(".gate-box");
      let ph = null;
      const fit = () => {
        if (!ph) return;
        const need = card.offsetTop + card.offsetHeight - (grid.clientHeight - (parseFloat(grid.style.paddingBottom) || 0));
        grid.style.paddingBottom = need > 0 ? need + 12 + "px" : "";
      };
      const float = on => {
        if (!inGate) return;
        if (on) {
          grid.querySelectorAll(".qcard.float").forEach(o => o !== card && o._close && o._close());
          ph = document.createElement("div"); ph.className = "qph"; ph.style.height = card.offsetHeight + "px";
          grid.insertBefore(ph, card); card.classList.add("float"); card.style.top = ph.offsetTop + "px";
          fit();
        } else if (ph) {
          card.classList.remove("float"); card.style.top = ""; ph.remove(); ph = null; grid.style.paddingBottom = "";
        }
      };
      if (opened.has(card.id)) card.classList.add("seen");
      card.querySelector(".qhead").addEventListener("click", e => {
        const open = body.hidden;
        if (open) float(true);
        body.hidden = !open; card.classList.toggle("open", open);
        e.currentTarget.setAttribute("aria-expanded", open);
        if (open && shown === 0 && (steps.length || th.hidden)) reveal();
        if (!open) float(false); else fit();
        if (open) setTimeout(() => card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }), 30);
      });
      next.addEventListener("click", reveal);
      card._close = () => { if (!body.hidden) card.querySelector(".qhead").click(); };
      card._openAll = () => { if (body.hidden) card.querySelector(".qhead").click(); while (shown < steps.length) reveal(); };
    });
    root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
      const url = location.href.split("#")[0] + "#" + b.dataset.copy;
      const done = () => { b.textContent = "הקישור הועתק"; setTimeout(() => b.textContent = "העתקת קישור לשאלה", 1800); };
      try { navigator.clipboard.writeText(url).then(done, () => { b.textContent = url; }); } catch (e) { b.textContent = url; }
    }));
    root.querySelectorAll("[data-thread]").forEach(b => b.addEventListener("click", () => {
      location.hash = b.dataset.thread;
    }));
  }

      const o = v.options[+b.dataset.ver]; const a = document.getElementById("verAns");
      a.textContent = o.text; a.classList.toggle("odd", !!o.right);
      if (o.right) document.getElementById("ladder").hidden = false;
    }));
  }

  /* ================= חדר ג' ================= */
  function roomC(r) {
    return `
    <div class="wrap">
      <div class="gates-grid">${r.gates.map((g, i) => `
        <section class="gate-box" id="gate-${i}" data-gi="${i}" data-title="${esc(g.title)}">
          <h2><small>${esc(splitTitle(g.title)[0])}</small>${esc(splitTitle(g.title)[1])}</h2>
          <p class="gate-meta">פרקים ${esc(g.cards[0].ch)}-${esc(g.cards[g.cards.length - 1].ch)}${g.isNew ? ` · ${esc(g.isNew)}` : ""}</p>
          <div class="minis cards">${g.cards.map(c => cCardHTML(c)).join("")}</div>
        </section>`).join("")}
      </div>
    </div>
`;
  }

  function cCardHTML(c) {
    return qcard(c, [["מהצד", c.side], ["מהאמצע", c.middle], ["מה נשאר", c.remains]],
      (c.from || []).map(f => threadLink(f, "במבוך:")).join(""));
  }
  function showGate(i) {
    const el = document.getElementById("gate-" + i);
    if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }
  function wireC() {}

  /* ================= חדר ד' ================= */
  function roomD(r) {
    return `<div class="wrap"><div class="gates-grid">${r.sections.map(s => gateBox(s.title, s.note, cardsHTML(s, () => []))).join("")}</div></div>`;
  }

  function wireD(r) {
    const s = r.sorter; let placed = 0, tries = 0;
    document.querySelectorAll(".tok").forEach(tok => {
      const it = s.items[+tok.dataset.row], fb = tok.querySelector(".fb");
      tok.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
        tries++;
        if (b.dataset.sort !== it.kind) {
          fb.hidden = false; fb.className = "fb no";
          fb.textContent = it.kind === "inf"
            ? "לא בדיוק. האם זה מוסיף משהו מעבר לעולם המוכר?"
            : "לא בדיוק. האם זה מצמצם את העולם המוכר למשהו אחר?";
          return;
        }
        placed++;
        tok.querySelector(".tok-btns").remove();
        fb.hidden = false; fb.className = "fb ok"; fb.textContent = (/[,-]/.test(it.ch) ? "פרקים " : "פרק ") + it.ch;
        tok.classList.add("placed", it.kind);
        document.getElementById(it.kind === "inf" ? "zInf" : "zRed").appendChild(tok);
        document.getElementById("score").textContent = placed < s.items.length
          ? `${placed} מתוך ${s.items.length} במקומם`
          : `כל תשעת הפריטים במקומם${tries === s.items.length ? ", בלי טעות אחת" : ""}.`;
        if (placed === s.items.length) {
          document.getElementById("midNote").textContent = "השמש זורחת בבוקר. האמצע נשאר בדיוק כפי שהיה.";
          document.querySelector(".z-mid").classList.add("clear");
          document.getElementById("sortOut").hidden = false;
        }
      }));
    });
  }

  /* ================= ניתוב ================= */
  function roomM(r) { return `<div class="wrap"><div class="gates-grid one">${gateBox(r.title, "", cardsHTML({ cards: r.cards }, c => c.game === "ask" ? [] : [["השאלה", c.intro]]))}</div></div>`; }
  function wireM() { wireA(byId.a); wireB(byId.b); wireD(byId.d); wireAsk(); }
  const BUILD = { a: [roomA, wireA], b: [roomB, wireB], c: [roomC, wireC], d: [roomD, wireD], m: [roomM, wireM] };

  function renderRoom(r, focusId) {
    document.title = `${r.name} · ${S.title}`;
    visited.add(r.id); store.set("visited", [...visited]);
    const sheet = "";
    const y = window.scrollY;
    app.innerHTML = `<div class="home home-strip">${homeTopHTML(r.id)}</div><div class="room" data-room="${r.id}">${railHTML(r)}<div class="room-main">${topbar(r)}${head(r)}${BUILD[r.id][0](r)}${roomFoot(r)}</div>${sheet}</div>${filmFloatHTML()}${filmPopHTML()}`;
    window.scrollTo(0, Math.min(y, document.querySelector(".room").offsetTop));
    wireDoors(); wireFilm(); placeBeam(r.id); setTimeout(() => placeBeam(r.id), 400);
    window.onresize = () => placeBeam(r.id);
    document.body.style.background = getComputedStyle(app.firstElementChild).backgroundColor;
    wireCards(app); BUILD[r.id][1](r); buildRail(r);
    if (focusId) setTimeout(() => focusCard(focusId), 60);
    else setTimeout(scrollToRoom, 30);
  }

  let current = null;
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "dsort") { location.replace("#g4"); return; }
    if (byId[h]) { current = h; renderRoom(byId[h]); return; }
    if (cardRoom[h]) {
      const t = cardRoom[h];
      if (current === t.room) focusCard(h);
      else { current = t.room; renderRoom(byId[t.room], h); }
      return;
    }
    current = null; window.onscroll = null; document.body.style.background = ""; renderHome(); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body></html>
